    <!--
      Loading screen: a spinning, shining 3D crystal (raw WebGL, no library) shown before the
      app bundle has even downloaded. Full intro once per session; on later page loads it only
      appears if loading is slow. While it is up, the page's own entrance animations are held
      (html.pl-lock) so they play as the loader lifts. Markup and script are at the top of <body>.
    -->
    <style>
      html.pl-lock { overflow: hidden; }
      html.pl-lock #root,
      html.pl-lock #root * { animation-play-state: paused !important; }

      #preloader {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center;
        color: #fff;
        transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1), filter 0.9s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.9s;
      }
      .pl-bg {
        position: absolute; inset: 0;
        background: radial-gradient(120% 90% at 50% 42%, #1c1c1c 0%, #0e0e0e 55%, #050505 100%);
        transition: opacity 0.95s cubic-bezier(0.4, 0, 0.2, 1) 0.3s;
      }
      /* Plain exit (pages without the hero crystal): the whole loader fades and blurs away. */
      #preloader.pl-out { opacity: 0; filter: blur(6px); visibility: hidden; pointer-events: none; }
      /* Home page exit: the crystal flies into the hero mark while the page fades in around it. */
      #preloader.pl-handoff { pointer-events: none; }
      #preloader.pl-handoff .pl-bg,
      #preloader.pl-handoff .pl-fx,
      #preloader.pl-handoff .pl-caption { opacity: 0; }
      .pl-fx, .pl-caption { transition: opacity 0.4s ease; }
      .pl-fx { position: absolute; inset: 0; }
      html.pl-handoff [data-preloader-target] { animation: none !important; }
      /* The crystal stage sits at the exact centre of the screen; the wordmark hangs below it. */
      .pl-inner { position: relative; }
      .pl-caption { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
      #preloader.pl-quiet .pl-inner { animation: pl-in 0.6s 0.45s both; }

      .pl-stage { position: relative; width: min(230px, 56vw); aspect-ratio: 3 / 4; animation: pl-in 1.2s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .pl-stage canvas, .pl-fallback { position: absolute; inset: 0; width: 100%; height: 100%; }
      .pl-glow {
        position: absolute; inset: -35%;
        background: radial-gradient(closest-side, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.03) 55%, rgba(255, 255, 255, 0) 75%);
        animation: pl-pulse 3.4s ease-in-out infinite;
      }
      .pl-fallback { display: none; color: #bbb399; padding: 18%; box-sizing: border-box; animation: pl-flip 2.8s linear infinite; }
      #preloader.pl-nogl canvas { display: none; }
      #preloader.pl-nogl .pl-fallback { display: block; }

      .pl-spark { position: absolute; color: #fff; opacity: 0; animation: pl-twinkle 2.8s ease-in-out infinite; }

      .pl-word {
        display: block; margin-top: 28px; width: 150px; height: auto; color: #fff;
        animation: pl-in 1.1s 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .pl-bar {
        margin-top: 18px; width: 132px; height: 1px; overflow: hidden;
        background: rgba(255, 255, 255, 0.14);
        animation: pl-in 1.1s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .pl-bar i { display: block; height: 100%; background: linear-gradient(90deg, rgba(255, 255, 255, 0.45), #fff); transform: scaleX(0); transform-origin: left; }

      @keyframes pl-in { from { opacity: 0; transform: translateY(14px) scale(0.97); } }
      @keyframes pl-pulse { 50% { transform: scale(1.12); opacity: 0.75; } }
      @keyframes pl-flip { to { transform: rotateY(360deg); } }
      @keyframes pl-twinkle {
        0%, 100% { opacity: 0; transform: scale(0.2) rotate(0deg); }
        18% { opacity: 1; transform: scale(1) rotate(25deg); }
        36% { opacity: 0; transform: scale(0.3) rotate(50deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pl-spark, .pl-glow { animation: none; }
        .pl-spark { display: none; }
      }
    </style>
    <noscript><style>#preloader { display: none; } html.pl-lock { overflow: auto; }</style></noscript>

        // Home page: the hero's crystal mark (data-preloader-target) is where the 3D crystal lands.
        // Works out the move and scale that put the 3D crystal exactly over it, or null if there is
        // nothing visible to land on (other pages, scrolled away, no WebGL, reduced motion).
        function planHandoff() {
          var target = document.querySelector('[data-preloader-target]')
          if (!target || !crystal || still || seen) return null
          root.classList.add('pl-handoff') // hero mark skips its own entrance: we deliver it
          target.style.opacity = '0'
          var mark = target.querySelector('svg') || target
          var tr = mark.getBoundingClientRect()
          if (!tr.height || tr.bottom < 0 || tr.top > innerHeight) {
            root.classList.remove('pl-handoff')
            target.style.opacity = ''
            return null
          }
          stage.style.animation = 'none'
          var sr = stage.getBoundingClientRect()
          var markHeight = (tr.height * 552) / 556 // the mark's outline within its 556-unit viewBox
          var crystalHeight = canvas.clientHeight * crystal.heightRatio
          return {
            target: target,
            dx: tr.left + tr.width / 2 - (sr.left + sr.width / 2),
            dy: tr.top + tr.height / 2 - (sr.top + sr.height / 2),
            scale: markHeight / crystalHeight,
          }
        }

        // Links such as /#portfolio: the browser looks for the section before React has built the
        // page (and scrolling is locked while we are up), so jump there ourselves on the way out.
        function scrollToHash() {
          var id = ''
          try { id = decodeURIComponent(location.hash.slice(1)) } catch (e) {}
          var section = id && document.getElementById(id)
          if (section) section.scrollIntoView({ block: 'start', behavior: 'instant' })
        }

        var MOVE = crystal ? crystal.settleSeconds * 1000 : 0, FADE_AT = MOVE - 150, FADE = 450
        var t0 = performance.now(), prog = 0, out = 0, handoff = null
        function frame(now) {
          var t = now - t0
          var done = loaded && t >= MIN
          var target = done ? 1 : 0.9 * (1 - Math.exp(-t / Math.max(MIN / 2.5, seen ? 600 : 1200)))
          prog += (target - prog) * (done ? 0.16 : 0.06)
          bar.style.transform = 'scaleX(' + prog.toFixed(4) + ')'
          if (!out && done && prog > 0.995) {
            out = now
            try { sessionStorage.setItem('awerton-intro', '1') } catch (e) {}
            root.classList.remove('pl-lock') // release scrolling and the page's entrance animations
            scrollToHash()
            handoff = planHandoff()
            el.classList.add(handoff ? 'pl-handoff' : 'pl-out')
          }
          var since = out ? now - out : 0

          if (handoff) {
            // Glide and shrink onto the hero mark while the spin settles facing front…
            var p = Math.min(since / MOVE, 1)
            var e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2
            stage.style.transform =
              'translate(' + (handoff.dx * e).toFixed(2) + 'px,' + (handoff.dy * e).toFixed(2) + 'px) scale(' + (1 + (handoff.scale - 1) * e).toFixed(4) + ')'
            crystal(t / 1000, 0, p)
            // …then crossfade from the 3D crystal into the real mark.
            var x = Math.min(Math.max((since - FADE_AT) / FADE, 0), 1)
            canvas.style.opacity = String(1 - x)
            handoff.target.style.opacity = String(x)
            if (x < 1) return requestAnimationFrame(frame)
            handoff.target.style.opacity = ''
          } else {
            var exit = out ? Math.min(since / 900, 1) : 0
            if (crystal) crystal(t / 1000, exit)
            if (exit < 1) return requestAnimationFrame(frame)
          }
          if (crystal) crystal.dispose()
          el.remove()
        }
        requestAnimationFrame(frame)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
