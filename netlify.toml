[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ / 22.12+.
  NODE_VERSION = "22"

# Fingerprinted JS/CSS from Vite never change — cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Videos, images and fonts are large; let browsers keep them for a week.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Client-side pages: serve the SPA shell for /services, /guides and /contacts.
[[redirects]]
  from = "/services"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/guides"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contacts"
  to = "/index.html"
  status = 200

# Property pages: /portfolio/aristo, /portfolio/prime-rest, /portfolio/royal-apart.
[[redirects]]
  from = "/portfolio/*"
  to = "/index.html"
  status = 200

# English versions of every page: /en, /en/services, /en/guides, /en/portfolio/<slug>.
[[redirects]]
  from = "/en"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/index.html"
  status = 200
